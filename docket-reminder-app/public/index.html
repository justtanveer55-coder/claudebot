<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;500&display=swap');
  body { margin:0; background:#F6F2E9; color:#26332B; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#FFFDF8; border:1px solid #DCD5C1; border-radius:12px; padding:28px; max-width:360px; width:90%; }
  h1 { font-family:'Source Serif 4',serif; margin-top:0; }
  input { width:100%; padding:10px; border:1px solid #DCD5C1; border-radius:6px; font-size:15px; margin-bottom:12px; box-sizing:border-box; }
  button { width:100%; padding:10px; border:none; background:#4F6B4F; color:#fff; border-radius:6px; font-size:15px; cursor:pointer; }
  p.hint { font-size:13px; color:#6B6E5F; }
</style>
</head>
<body>
  <div class="card">
    <h1>Docket</h1>
    <p class="hint">Enter your name to get your own reminder list and Telegram link.</p>
    <input id="nameInput" type="text" placeholder="Your name" />
    <button id="goBtn">Create my list</button>
  </div>
<script>
  document.getElementById('goBtn').onclick = async () => {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    const res = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const user = await res.json();
    window.location.href = '/u.html?id=' + user.id;
  };
</script>
</body>
</html>
